<script>
  // Cole aqui o link /exec da sua implantação, sem o parâmetro
  const URL_APPS_SCRIPT = 'https://script.google.com/macros/s/AKfycby7NQBzyfcAEYeYkV1LfgcVatzGJBp6tqQPR0GnnwhgaVZOdCMaL8uzi-IOSNt9E_-n/exec';

  function abrirFormulario() {
    document.getElementById('painel').classList.add('aberto');
    document.getElementById('nome').focus();
  }

  function fecharFormulario() {
    document.getElementById('painel').classList.remove('aberto');
  }

  document.getElementById('painel').addEventListener('click', function (e) {
    if (e.target === this) fecharFormulario();
  });

  document.getElementById('formPresenca').addEventListener('submit', function (e) {
    e.preventDefault();

    const nome = document.getElementById('nome').value.trim();
    const botao = document.getElementById('enviar');
    const mensagem = document.getElementById('mensagem');

    if (nome.length < 2) {
      mensagem.textContent = 'Digite seu nome para continuar.';
      return;
    }

    botao.disabled = true;
    botao.textContent = 'Registrando sua confirmação...';
    mensagem.textContent = '';

    const url = URL_APPS_SCRIPT + '?nome=' + encodeURIComponent(nome);

    fetch(url)
      .then(function (r) { return r.json(); })
      .then(function (resposta) {
        if (!resposta || resposta.ok !== true) {
          throw new Error(
            (resposta && resposta.erro) || 'Não foi possível registrar. Tente novamente.'
          );
        }

        document.getElementById('formPresenca').style.display = 'none';

        const titulo = document.createElement('h3');
        titulo.textContent = 'Presença confirmada! 🎉';

        const resultado = document.createElement('p');
        resultado.textContent =
          'Obrigado, ' + (resposta.nome || nome) +
          '! Você ficou responsável pela fralda tamanho ' +
          resposta.tamanho + '. 💗';

        mensagem.replaceChildren(titulo, resultado);
      })
      .catch(function (erro) {
        botao.disabled = false;
        botao.textContent = 'Tentar novamente';
        mensagem.textContent = erro.message;
      });
  });
</script>
